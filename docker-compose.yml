services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jme-postgres
    environment:
      POSTGRES_USER: jme
      POSTGRES_PASSWORD: jme
      POSTGRES_DB: jme
    ports:
      - "5433:5432"
    volumes:
      - jme-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jme -d jme"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: jme-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - jme-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  jme-pgdata:
  jme-redisdata:
