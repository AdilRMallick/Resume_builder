# Canonical skill taxonomy for the Job Match Engine.
#
# This file is the ONLY source of truth for `canonical_skill` and `skill_alias`.
# Nothing else may create a canonical skill: the resolver writes unmatched text to
# `skill_alias_candidate`, and the `jme taxonomy approve|promote` commands are the
# only path from that queue into the taxonomy. Auto-creation causes taxonomy drift
# within a week and silently breaks every aggregate number.
#
# CURATION RULES
#
# 1. One node per concept. "Postgres", "PostgreSQL" and "psql" are one node, not three.
#    Consolidate aggressively: the whole point is that the gap report can count.
# 2. `is_actionable: false` for anything I cannot close a gap on by building something:
#    soft skills, industry verticals, degree/credential requirements, and vague
#    catch-alls like "cloud platforms". The gap report filters on this flag.
# 3. Aliases are matched on token boundaries after normalization (see
#    jme/taxonomy/normalize.py), so "go" never matches inside "django" / "mongo" /
#    "ongoing". Normalization lowercases, maps "&" to "and", drops punctuation, and
#    PRESERVES "+", "#" and internal/leading "." so c++, c#, .net and node.js survive.
# 4. There is no stemming. If the plural form appears in job descriptions, list it
#    explicitly ("microservice" and "microservices"). Stemming is not worth the
#    false positives ("cs" -> "c").
# 5. An alias may belong to exactly one skill. The seeder hard-fails on ambiguity;
#    that is a data bug, not a warning.
# 6. Short/English-word aliases ("go", "c", "r", "rest", "express", "spring", "node")
#    are allowed but are backed by the guard phrases in jme/taxonomy/resolver.py,
#    which mask spans like "go to market", "R&D", "the rest of", "spring 2027".
#
# The skill's own name is always added as an alias automatically. Do not list it.

