[project]
name = "jme"
version = "0.1.0"
description = "Job Match Engine - ingests job feeds, matches against an evidence corpus, reports skill gaps"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0",
    "httpx>=0.27",
    "truststore>=0.10.4",
    "anthropic>=0.40",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "tenacity>=8.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "fakeredis>=2.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
jme = "jme.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jme"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: requires a live Postgres and/or Redis",
    "live: hits the network or a paid API; skipped by default",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: line length is handled by the formatter.
# UP042: `class Foo(str, Enum)` is deliberate, not a StrEnum oversight. SQLAlchemy's
#        Enum type and JSON/JSONB round-tripping both rely on the members being real
#        `str` instances, and the values are part of the database schema.
ignore = ["E501", "UP042"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
